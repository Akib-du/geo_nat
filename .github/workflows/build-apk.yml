name: Build GeoLite APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble project archive
        run: |
          cat GeoLiteNative-source.b64.part* | base64 -d > GeoLiteNative-source.zip
          unzip -q GeoLiteNative-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: GeoLiteNative
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GeoLiteNative-debug-apk
          path: GeoLiteNative/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
